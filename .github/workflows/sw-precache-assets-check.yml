name: SW Precache Assets Check

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  check-sw-precache-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check sw.js APP_FILES coverage
        run: npm run check:sw
