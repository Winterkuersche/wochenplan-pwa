name: Global Helper Collision Check

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  check-global-helper-collisions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check duplicate global helper names
        run: npm run check:globals
