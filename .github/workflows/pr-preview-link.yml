name: PR Preview Link

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-link:
    runs-on: ubuntu-latest
    concurrency:
      group: pr-preview-deployment
      cancel-in-progress: false
    steps:
      - name: Checkout PR revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-source

      - name: Checkout preview repository
        uses: actions/checkout@v4
        with:
          repository: Winterkuersche/wochenplan-pwa-preview
          token: ${{ secrets.PREVIEW_REPOSITORY_TOKEN }}
          path: preview-repository

      - name: Publish PR revision
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          preview_directory="preview-repository/pr-${PR_NUMBER}"
          mkdir -p "$preview_directory"
          rsync --archive --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            pr-source/ "$preview_directory/"

          cd preview-repository
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "pr-${PR_NUMBER}"

          if git diff --cached --quiet; then
            echo "Preview pr-${PR_NUMBER} is already up to date."
          else
            git commit -m "Update preview for PR #${PR_NUMBER} (${PR_SHA:0:7})"
            git push
          fi

      - name: Publish preview link comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-link -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const previewUrl = `https://winterkuersche.github.io/wochenplan-pwa-preview/pr-${pr.number}/`;
            const body = `${marker}\n### 📱 PR Preview\n\n[Preview auf dem iPhone öffnen](${previewUrl})\n\nStand: \`${sha.slice(0, 7)}\`\n\n> Die Preview wird über das separate GitHub-Pages-Repository bereitgestellt. Nach einem neuen PR-Commit kann es einige Minuten dauern, bis der Teststand aktualisiert ist.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }
