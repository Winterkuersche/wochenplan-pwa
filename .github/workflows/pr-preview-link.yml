name: PR Preview Link

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview-link:
    runs-on: ubuntu-latest
    steps:
      - name: Publish preview link comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-link -->';
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const previewUrl = `https://raw.githack.com/${owner}/${repo}/${sha}/index.html`;
            const body = `${marker}\n### 📱 PR Preview\n\n[Preview auf dem iPhone öffnen](${previewUrl})\n\nStand: \`${sha.slice(0, 7)}\`\n\n> Diese Preview lädt exakt den aktuellen PR-Commit. Sie ist für UI- und Funktionsprüfungen gedacht; GitHub-Pages-/Service-Worker-Verhalten kann sich von der Live-Seite unterscheiden.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }
