<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Planung 2 · Prototyp</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:end;gap:8px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.09em;color:#68707a}.top h1{font-size:20px;margin:2px 0}.nav button,.weeks button{border:1px solid #cfd5dc;background:white;border-radius:9px;padding:7px 10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.card{background:white;border:1px solid #d8dde3;border-radius:10px;padding:8px;min-width:0}.card span{font-size:9px;color:#69717b;display:block}.card strong{font-size:12px;display:block;margin-top:3px}.weeks{display:flex;gap:5px;overflow:auto;margin-bottom:8px}.weeks button{font-size:10px;white-space:nowrap;padding:5px 8px}.weeks button.on{font-weight:900;outline:2px solid #253247}.table{border:1px solid #d8dde3;border-radius:12px;overflow:hidden;background:white}.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.head,.row{display:grid;grid-template-columns:104px 516px;min-width:620px}.head{background:#eef0f3}.names{position:sticky;left:0;z-index:3;background:inherit;border-right:1px solid #d8dde3;padding:7px}.days{display:grid;grid-template-columns:repeat(6,86px)}.day{text-align:center;padding:5px 3px;border-right:1px solid #d8dde3;min-height:66px}.day b{font-size:11px}.date{font-size:9px;color:#707780}.icons{height:20px;line-height:20px;font-size:12px}.check{font-size:8px;font-weight:800}.bad{color:#b42318}.ok{color:#19713a}.row{border-top:1px solid #d8dde3}.person{position:sticky;left:0;z-index:2;background:white;border-right:1px solid #d8dde3;padding:6px;min-height:58px}.person b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{font-size:9px;color:#6d7580}.hours{font-size:9px;margin-top:4px}.warn{font-size:8px;color:#805300;font-weight:800}.cell{min-height:58px;border-right:1px solid #d8dde3;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:3px;background:#fff}.cell.shift{background:#eef5ff}.cell.off{background:#f1f2f4}.cell.abs{background:#fff5dc}.cell b{font-size:10px}.cell small{font-size:8px;color:#68707a;margin-top:2px}.note{font-size:9px;color:#747c85;margin:8px 2px}.empty{padding:18px;color:#707780;font-size:12px}@media(prefers-color-scheme:dark){body{background:#101318;color:#edf1f5}.card,.table,.nav button,.weeks button,.person,.cell{background:#1a1f26;border-color:#353d47}.head{background:#252b33}.cell.shift{background:#17283e}.cell.off{background:#232830}.cell.abs{background:#392f18}.date,.role,.cell small,.eyebrow,.note,.card span{color:#aeb7c1}}</style></head><body><div class="app"><div class="top"><div><div class="eyebrow">PROTOTYP · PLANUNG 2</div><h1 id="title">Monat</h1></div><div class="nav"><button id="prev">◀</button><button id="next">▶</button></div></div><div class="summary"><div class="card"><span>TZ noch offen</span><strong id="tz">—</strong></div><div class="card"><span>GFB Monat</span><strong id="gfb">—</strong></div><div class="card"><span>Grundbesetzung</span><strong id="coverage">—</strong></div></div><div id="weeks" class="weeks"></div><div class="table"><div class="scroll"><div id="grid"></div></div></div><div class="note">Erste Testversion: Fokus auf Hochformat, Informationsdichte und Übersicht. Noch keine Bearbeitung in dieser Ansicht.</div></div><script>const MASTER='wochenplan_master_v10',PLAN='wochenplan_plan_v10';const demand=[['📦 ✨','Ware · Pflege'],['✨','Pflege'],['🚚','Lieferung'],['📦📦','hoher Warenbedarf'],['🔥 🚚','Umsatz · Lieferung'],['🔥 ✨ 📦','Umsatz · Optik · Ware']];let d=new Date();d.setDate(1);let activeWeek=0;const pad=n=>String(n).padStart(2,'0'),iso=x=>x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()),hm=m=>Math.floor(Math.max(0,m)/60)+':'+pad(Math.max(0,m)%60);function load(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}function monday(x){let r=new Date(x),n=r.getDay()||7;r.setDate(r.getDate()-n+1);r.setHours(0,0,0,0);return r}function weeks(){let first=new Date(d.getFullYear(),d.getMonth(),1),last=new Date(d.getFullYear(),d.getMonth()+1,0),cur=monday(first),out=[];while(cur<=last){let w=[];for(let i=0;i<6;i++){let x=new Date(cur);x.setDate(cur.getDate()+i);w.push(x)}out.push(w);cur.setDate(cur.getDate()+7)}return out}function mins(v){if(!/^\d{1,2}:\d{2}$/.test(v||''))return 0;let[a,b]=v.split(':').map(Number);return a*60+b}function entry(plan,eid,day){return plan.schedule?.[iso(day)]?.[eid]||null}function active(emp){let ym=d.getFullYear()+'-'+pad(d.getMonth()+1);return(!emp.activeFromMonth||ym>=emp.activeFromMonth)&&(!emp.activeToMonth||ym<=emp.activeToMonth)}function dayMinutes(e){if(!e||e.type!=='shift'||!e.start||!e.end)return 0;if(Number.isFinite(Number(e.minutes)))return Number(e.minutes);return Math.max(0,mins(e.end)-mins(e.start)-(Number(e.pause)||0))}function coverage(emps,plan,day){let es=emps.map(e=>entry(plan,e.id,day)).filter(e=>e?.type==='shift'&&e.start&&e.end);let count=t=>es.filter(e=>mins(e.start)<=t&&mins(e.end)>t).length;if(count(535)<1)return[false,'08:55 fehlt'];let start=null;for(let t=540;t<1150;t+=5){let c=count(t);if(c<2&&start===null)start=t;if(c>=2&&start!==null){if(t-start>60)return[false,hm(start)+'–'+hm(t)+' <2'];start=null}}if(start!==null&&1150-start>60)return[false,hm(start)+'–19:10 <2'];return[true,'✓ Besetzung']}function cell(e){if(!e)return['—','',''];if(e.type==='shift')return[(e.start||'')+'–'+(e.end||''),e.code||e.shiftKey||'Schicht','shift'];if(e.type==='off')return['Frei','AG-Frei','off'];if(e.type==='vacation'||e.status==='vacation')return['U','Urlaub','abs'];if(e.status==='sick')return['K','Krank','abs'];if(e.type==='external-help')return['AH',e.branch||'Aushilfe','abs'];return[e.label||'—','','']}function render(){let master=load(MASTER,{employees:[]}),plan=load(PLAN,{schedule:{},absences:[]}),emps=(master.employees||[]).filter(active),ws=weeks();activeWeek=Math.max(0,Math.min(activeWeek,ws.length-1));let w=ws[activeWeek];document.getElementById('title').textContent=d.toLocaleDateString('de-DE',{month:'long',year:'numeric'});document.getElementById('weeks').innerHTML=ws.map((x,i)=>'<button class="'+(i===activeWeek?'on':'')+'" data-w="'+i+'">'+pad(x[0].getDate())+'.'+pad(x[0].getMonth()+1)+'–'+pad(x[5].getDate())+'.'+pad(x[5].getMonth()+1)+'</button>').join('');let probs=w.filter(x=>!coverage(emps,plan,x)[0]).length;document.getElementById('coverage').textContent=probs?probs+' Tag(e) prüfen':'✓ komplett';document.getElementById('coverage').className=probs?'bad':'ok';let tzOpen=0,gfb=0;emps.forEach(e=>{let weekly=w.reduce((s,x)=>s+dayMinutes(entry(plan,e.id,x)),0);if((e.roleKey||'').toUpperCase()==='GFB'){let monthTotal=0;Object.entries(plan.schedule||{}).forEach(([day,all])=>{if(day.startsWith(d.getFullYear()+'-'+pad(d.getMonth()+1)))monthTotal+=dayMinutes(all[e.id])});gfb+=monthTotal}else tzOpen+=Math.max(0,mins(e.target||'0:00')-weekly)});document.getElementById('tz').textContent=hm(tzOpen);document.getElementById('gfb').textContent=hm(gfb)+' / 43:00+';let heads=w.map((x,i)=>{let c=coverage(emps,plan,x);return'<div class="day"><b>'+['Mo','Di','Mi','Do','Fr','Sa'][i]+' <span class="date">'+pad(x.getDate())+'.'+pad(x.getMonth()+1)+'</span></b><div class="icons" title="'+demand[i][1]+'">'+demand[i][0]+'</div><div class="check '+(c[0]?'ok':'bad')+'">'+c[1]+'</div></div>'}).join('');let rows=emps.map(e=>{let total=w.reduce((s,x)=>s+dayMinutes(entry(plan,e.id,x)),0),target=mins(e.target||'0:00'),hasFree=w.some(x=>entry(plan,e.id,x)?.type==='off');let cells=w.map(x=>{let a=cell(entry(plan,e.id,x));return'<div class="cell '+a[2]+'"><b>'+a[0]+'</b><small>'+a[1]+'</small></div>'}).join('');return'<div class="row"><div class="person"><b>'+((e.name||'—').replaceAll('<','&lt;'))+'</b><div class="role">'+(e.roleKey||'-')+'</div><div class="hours">'+hm(total)+' / '+(e.roleKey==='GFB'?'Bedarf':hm(target))+'</div>'+(hasFree?'':'<div class="warn">⚠ Frei fehlt</div>')+'</div><div class="days">'+cells+'</div></div>'}).join('');document.getElementById('grid').innerHTML='<div class="head"><div class="names"><b style="font-size:10px">Mitarbeiter · Stunden</b></div><div class="days">'+heads+'</div></div>'+(rows||'<div class="empty">Keine Stammdaten in dieser Preview gefunden.</div>')}document.getElementById('weeks').onclick=e=>{let b=e.target.closest('[data-w]');if(b){activeWeek=Number(b.dataset.w);render()}};document.getElementById('prev').onclick=()=>{d.setMonth(d.getMonth()-1);activeWeek=0;render()};document.getElementById('next').onclick=()=>{d.setMonth(d.getMonth()+1);activeWeek=0;render()};let p=load(PLAN,{});if(p.weekFrom){let x=new Date(p.weekFrom+'T00:00:00');if(!isNaN(x)){d=new Date(x.getFullYear(),x.getMonth(),1)}}render();</script></body></html>
